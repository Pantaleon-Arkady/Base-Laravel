services:
  app:
    build:
      context: ./docker/php
    container_name: base_laravel_app
    working_dir: /var/www
    volumes:
      - ./laravel:/var/www
    depends_on:
      - node
      - postgres

  nginx:
    image: nginx:alpine
    container_name: base_laravel_nginx
    ports:
      - "8000:80"
    volumes:
      - ./laravel:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  node:
    image: node:20
    container_name: base_laravel_node
    working_dir: /var/www
    volumes:
      - ./laravel:/var/www
    ports:
      - "5173:5173"
    command: sh -c "npm run dev -- --host"

  postgres:
    image: postgres:16-alpine
    container_name: base_laravel_db
    environment:
      POSTGRES_DB: base_laravel
      POSTGRES_USER: base_laravel_user
      POSTGRES_PASSWORD: base_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: base_laravel_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:

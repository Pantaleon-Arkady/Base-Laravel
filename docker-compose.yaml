services:
  app:
    build:
      context: ./docker/php
    container_name: base_laravel_app
    working_dir: /var/www
    volumes:
      - ./laravel:/var/www
    depends_on:
      - node

  nginx:
    image: nginx:alpine
    container_name: base_laravel_nginx
    ports:
      - "8000:80"
    volumes:
      - ./laravel:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  node:
    image: node:20
    container_name: base_laravel_node
    working_dir: /var/www
    volumes:
      - ./laravel:/var/www
    ports:
      - "5173:5173"
    command: sh -c "npm run dev -- --host"
